<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso | Digitaliza Urpín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] shadow-2xl p-10 max-w-md w-full text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-6">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 mb-3">¡Pago Procesado!</h1>
        <p class="text-sm text-slate-500 mb-6">
            Tu pago ha sido recibido exitosamente. En un momento se abrirá WhatsApp para enviar tu pedido al negocio.
        </p>

        <div id="estado-envio" class="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-6">
            <p class="text-xs font-bold text-blue-800">
                <i class="fas fa-spinner animate-spin mr-2"></i>
                Preparando tu pedido...
            </p>
        </div>

        <button onclick="enviarManualmente()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest transition-all shadow-lg">
            <i class="fab fa-whatsapp mr-2"></i> Enviar Pedido por WhatsApp
        </button>

        <button onclick="volverAlMenu()" 
                class="w-full mt-3 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-2xl font-bold uppercase text-[10px] tracking-widest transition-all">
            <i class="fas fa-arrow-left mr-2"></i> Volver al Menú
        </button>
    </div>

    <script type="module">
        // ==================== IMPORTS FIREBASE ====================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAstAXcgNXevSuTbgZYQ_U9_SwhUI4tzTY",
            authDomain: "digitaliza-urpin.firebaseapp.com",
            projectId: "digitaliza-urpin",
            storageBucket: "digitaliza-urpin.firebasestorage.app",
            messagingSenderId: "634374370608",
            appId: "1:634374370608:web:91861bb040c110d560c4f5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        initializeAppCheck(app, {
            provider: new ReCaptchaV3Provider('6LcDST0tAAAAAIsL4Py1fORj7RKUEx-u-16fU0zD'),
            isTokenAutoRefreshEnabled: true
        });

        const APP_ID = "digitaliza-urpin-2026";

        // ==================== FUNCIONES ====================
        async function construirMensajeYEnviar() {
            const pedidoDataStr = localStorage.getItem('pedidoPendienteData');
            
            if (!pedidoDataStr) {
                document.getElementById('estado-envio').innerHTML = `
                    <p class="text-xs font-bold text-amber-800">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        No se encontró información del pedido. Vuelve al menú.
                    </p>
                `;
                return false;
            }

            const pedidoLocal = JSON.parse(pedidoDataStr);
            const pedidoRef = doc(db, "artifacts", APP_ID, "public", "data", "pedidos", pedidoLocal.referencia);
            const pedidoSnap = await getDoc(pedidoRef);

            if (!pedidoSnap.exists()) {
                document.getElementById('estado-envio').innerHTML = `
                    <p class="text-xs font-bold text-red-800">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        No se encontró el pedido en el sistema.
                    </p>
                `;
                return false;
            }

            const pedido = pedidoSnap.data();
            const telefono = (pedido.negocioData?.whatsapp || '584120000000').replace(/\D/g, '');

            // Construir mensaje WhatsApp
            let mensaje = `*✅ PEDIDO PAGADO - ${pedido.negocio}*\n`;
            mensaje += `📋 *REF: ${pedido.referencia}*\n`;
            mensaje += `📅 ${new Date(pedido.fecha).toLocaleString('es-VE')}\n`;
            mensaje += `💰 *ESTADO: PAGADO (Wayu Pay)*\n`;
            if (pedido.mesa) {
                mensaje += `🍽️ *MESA:* ${pedido.mesa}\n`;
            }
            mensaje += `--------------------------\n\n`;

            for (const detalle of pedido.items) {
                mensaje += `✅ *${detalle.cantidad}x* ${detalle.nombre}\n`;
                if (detalle.extras && detalle.extras.length > 0) {
                    const extrasConPrecio = detalle.extras.filter(e => e.precio > 0);
                    if (extrasConPrecio.length > 0) {
                        mensaje += `   *Extras:*\n`;
                        for (const extra of extrasConPrecio) {
                            mensaje += `      + ${extra.nombre} (+$${extra.precio.toFixed(2)})\n`;
                        }
                    }
                }
                mensaje += `   *Precio:* $${detalle.precioUnitario.toFixed(2)}\n`;
                mensaje += `   *Subtotal:* $${detalle.subtotal.toFixed(2)}\n\n`;
            }

            mensaje += `--------------------------\n`;
            mensaje += `💰 *TOTAL USD:* $${pedido.totalUSD.toFixed(2)}\n`;
            mensaje += `💵 *TOTAL ${pedido.moneda}:* ${pedido.totalLocal.toLocaleString('es-VE')}\n`;
            mensaje += `📊 Tasa: ${(pedido.tasaBCV || 0).toFixed(2)} ${pedido.moneda}/USD\n`;

            if (pedido.deliveryAplicado) {
                mensaje += `🚚 *Delivery:* +$${pedido.deliveryMonto.toFixed(2)}\n`;
            }

            if (!pedido.exentoIVA) {
                mensaje += `⚖️ IVA incluido en el precio final.\n`;
            }

            mensaje += `\n_✅ Pago confirmado por Wayu Pay._`;
            mensaje += `\n_Por favor, preparar el pedido._`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;

            document.getElementById('estado-envio').innerHTML = `
                <p class="text-xs font-bold text-emerald-800">
                    <i class="fas fa-check-circle mr-2"></i>
                    ¡Pedido enviado a WhatsApp!
                </p>
                <p class="text-[10px] text-slate-500 mt-1">Si no se abrió, haz clic en el botón de abajo.</p>
            `;

            window.open(urlWhatsApp, '_blank');

            // Limpiar localStorage
            localStorage.removeItem('pedidoPendiente');
            localStorage.removeItem('pedidoPendienteData');
            localStorage.removeItem('ultimoPedidoPagado');

            return true;
        }

        window.enviarManualmente = function() {
            construirMensajeYEnviar();
        };

        window.volverAlMenu = function() {
            const clienteId = localStorage.getItem('ultimoClienteId');
            let url = '/';
            if (clienteId) {
                url = `/menu.html?id=${clienteId}`;
            }
            window.location.href = url;
        };

        // Auto-ejecutar al cargar
        window.addEventListener('load', () => {
            setTimeout(() => {
                construirMensajeYEnviar();
            }, 1500);
        });
    </script>
</body>
</html>
