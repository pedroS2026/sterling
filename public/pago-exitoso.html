<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso | Digitaliza Urpín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] shadow-2xl p-10 max-w-md w-full text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-6">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 mb-3">¡Pago Procesado!</h1>
        <p class="text-sm text-slate-500 mb-6">
            Tu pago ha sido recibido exitosamente. Para completar el proceso, vuelve al menú del negocio y notifica tu pedido por WhatsApp.
        </p>
        
        <div class="bg-slate-50 rounded-2xl p-4 mb-6">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">Referencia del pedido (opcional)</p>
            <input type="text" id="pedido-input" placeholder="Ej: REF-XXXX-XXXX" 
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-center outline-none focus:border-blue-500 transition-all">
            <p class="text-[10px] text-slate-400 mt-2">Ingresa la referencia que recibiste en tu pedido, si la tienes.</p>
        </div>

        <button onclick="volverAlMenu()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest transition-all shadow-lg">
            <i class="fas fa-arrow-left mr-2"></i> Volver al Menú y Enviar Pedido
        </button>
    </div>

    <script>
        function volverAlMenu() {
            const input = document.getElementById('pedido-input').value.trim();
            const referencia = input || '';
            const clienteId = localStorage.getItem('ultimoClienteId');
            
            let url = '/'; // Por defecto, va a la raíz
            
            if (clienteId) {
                url = `/menu.html?id=${clienteId}`;
                if (referencia) {
                    url += `&pedido=${encodeURIComponent(referencia)}`;
                }
            }
            
            window.location.href = url;
        }
    </script>
</body>
</html>
